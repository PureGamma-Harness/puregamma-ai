name: Web dependency compatibility

on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'apps/web/pnpm-workspace.yaml'
      - 'apps/web/tests/minimatch-compat.test.cjs'
      - 'apps/web/tests/production-dependency-compat.test.cjs'
      - '.github/workflows/web-dependencies.yml'
  push:
    branches: [main, refactor/harness-core-v2]
    paths:
      - 'apps/web/package.json'
      - 'apps/web/pnpm-lock.yaml'
      - 'apps/web/pnpm-workspace.yaml'
      - 'apps/web/tests/minimatch-compat.test.cjs'
      - 'apps/web/tests/production-dependency-compat.test.cjs'
      - '.github/workflows/web-dependencies.yml'

permissions:
  contents: read

concurrency:
  group: web-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:dependency-compat
      - run: pnpm typecheck
      - run: pnpm lint
