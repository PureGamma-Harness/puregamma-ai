name: API integration

on:
  push:
    branches: [main, refactor/harness-core-v2]
    paths:
      - 'apps/api/**'
      - 'apps/pocket-relay/**'
      - 'packages/**'
      - 'services/nautilus-runtime/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/api-integration.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/pocket-relay/**'
      - 'packages/**'
      - 'services/nautilus-runtime/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/api-integration.yml'

permissions:
  contents: read

concurrency:
  group: api-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-observation-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      ENABLE_MOCK_MARKET_DATA: 'true'
      LIVE_TRADING_ENABLED: 'false'
      LIVE_TRADING_DEPLOYMENT_APPROVED: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/pocket-relay/requirements.txt

      - name: Install API and Pocket Relay test dependencies
        run: python -m pip install -r apps/api/requirements.txt -r apps/pocket-relay/requirements.txt

      - name: Use Node 22 for the built-in Relay control page tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the built-in Relay control page
        run: node --test apps/pocket-relay/tests/control-page.test.cjs

      - name: Run the backend regression suite
        run: python -m pytest -q -ra
